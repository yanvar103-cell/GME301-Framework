<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | GME301-Framework</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Make the page and container fill the whole browser viewport */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #unity-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      /* canvas size is now set dynamically by JS below, not fixed pixels */
      #unity-canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">GME301-Framework</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // the game's fixed design aspect ratio -- matches your Canvas Scaler's
      // Reference Resolution (1920x1080), so the UI always scales cleanly
      var GAME_ASPECT_WIDTH = 1920;
      var GAME_ASPECT_HEIGHT = 1080;

      // Resize the canvas's on-screen CSS size (not its internal render resolution)
      // to fit inside the browser window while preserving the aspect ratio,
      // letterboxing (black bars) instead of stretching/distorting.
      function resizeCanvas() {
        var aspectRatio = GAME_ASPECT_WIDTH / GAME_ASPECT_HEIGHT;
        var windowWidth = window.innerWidth;
        var windowHeight = window.innerHeight;
        var windowAspect = windowWidth / windowHeight;

        var newWidth, newHeight;
        if (windowAspect > aspectRatio) {
          // window is relatively wider than the game -- letterbox left/right
          newHeight = windowHeight;
          newWidth = newHeight * aspectRatio;
        } else {
          // window is relatively taller than the game -- letterbox top/bottom
          newWidth = windowWidth;
          newHeight = newWidth / aspectRatio;
        }

        canvas.style.width = newWidth + "px";
        canvas.style.height = newHeight + "px";
      }

      window.addEventListener("resize", resizeCanvas);

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/GME301-Framework.loader.js";
      var config = {
        dataUrl: buildUrl + "/GME301-Framework.data.gz",
        frameworkUrl: buildUrl + "/GME301-Framework.framework.js.gz",
        codeUrl: buildUrl + "/GME301-Framework.wasm.gz",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GameDevHQ",
        productName: "GME301-Framework",
        productVersion: "0.1",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        unityShowBanner('WebGL builds are not supported on mobile devices.');
        resizeCanvas();
      } else {
        resizeCanvas(); // set the initial responsive size instead of a fixed 1920x1080
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
